name: Build wheels

on:
  push:
    tags:
      - "v*-usg.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-22.04
          arch: x86_64
        - os: ubuntu-22.04
          arch: aarch64
        - os: windows-2022
          arch: AMD64
        - os: macos-15
          arch: arm64
          macosx_deployment_target: "15.0"
          cmake_osx_architectures: arm64
        - os: macos-15-intel
          arch: x86_64
          macosx_deployment_target: "15.0"
          cmake_osx_architectures: x86_64

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        if: runner.os == 'Linux' && matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install MinGW-w64 tools (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-lapack
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja

      - name: Build pestutils (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          LDFLAGS: -static-libgcc -static-libgfortran -static-libquadmath -Wl,-Bstatic,--whole-archive -lwinpthread -Wl,--no-whole-archive
        run: bash scripts/build_lib.sh

      - name: Install GCC Fortran (macOS)
        if: runner.os == 'macOS'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 13

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT_MACOS:
            MACOSX_DEPLOYMENT_TARGET='${{ matrix.macosx_deployment_target }}'
            CMAKE_OSX_ARCHITECTURES='${{ matrix.cmake_osx_architectures }}'

      - uses: actions/upload-artifact@v5
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v5
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  draft_github_release:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Add installation files and checksums
        run: |
          cp environment-usg.yml requirements-usg.txt RELEASE_NOTES.md dist/
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create draft fork release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
